name: Compiler et publier

# Mac de GitHub facturés à la minute (le plus cher des runners) : une seule compilation par version
# (choix de Titelive, 25/11/2026). Plus de compilation sur main ni sur les PR : elles ne publiaient rien.
# Pour une simple compilation d'essai, lancer le workflow à la main sans numéro de version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de la version à publier (ex. 1.1.0). Laisser vide pour une simple compilation."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          sw_vers
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version

      - name: Récupérer sc64deployer (dernière version officielle)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deployer
          gh release download --repo Polprzewodnikowy/SummerCart64 --pattern 'sc64-deployer-macos-*.tgz' --dir deployer
          tar -xzf deployer/*.tgz -C deployer
          found="$(find deployer -type f -name sc64deployer | head -n 1)"
          cp "$found" ./sc64deployer
          chmod +x ./sc64deployer
          file ./sc64deployer

      - name: Version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier les fiches de jeu (sources en ligne)
        continue-on-error: true
        run: |
          xcrun swiftc -parse-as-library -target arm64-apple-macos26.0 Sources/GameInfoService.swift Sources/ThumbnailIndex.swift Sources/Localization.swift Tools/GameInfoCheck.swift -o gameinfo-check
          ./gameinfo-check "Banjo-Tooie (Europe) (En,Fr,De,Es)" "Super Mario 64 (Europe) (En,Fr,De)" "Conker's Bad Fur Day (Europe)" "Animal Forest (Japan)" "Animal Forest (J) [T+Eng1.0_Zoinkity] [i] [n]"

      - name: Compiler et créer l'image disque
        run: VERSION="${{ steps.version.outputs.value }}" ./build.sh --dmg

      - name: Conserver l'image disque
        uses: actions/upload-artifact@v4
        with:
          name: SummerDrop-${{ steps.version.outputs.value }}
          path: build/SummerDrop.dmg

      - name: Publier la version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" build/SummerDrop.dmg \
            --target "$GITHUB_SHA" \
            --title "Summer Drop ${{ steps.version.outputs.value }}" \
            --generate-notes
